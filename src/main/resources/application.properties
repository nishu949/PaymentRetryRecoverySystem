# ============================================
# DEFAULT PROFILE
# ============================================
spring.profiles.active=local

# ============================================
# LOCAL PROFILE - MySQL
# ============================================
spring.config.activate.on-profile=local

spring.datasource.url=jdbc:mysql://localhost:3306/payment?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root8668
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8081
logging.level.com.payment_retry_system=DEBUG

# ============================================
# RENDER PROFILE - H2
# ============================================
spring.config.activate.on-profile=render

spring.datasource.url=jdbc:h2:file:./data/paymentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

server.port=
logging.level.com.payment_retry_system=INFO

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
